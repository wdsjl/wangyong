<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能炒股 · Web 面板</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="hero">
        <div>
          <h1>智能炒股</h1>
          <p>多因子技术指标分析 · K 线可视化 · 交易信号面板</p>
        </div>
        <div class="badge" id="modeBadge">模式加载中...</div>
      </header>

      <section class="panel">
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="输入股票代码或名称，例如 600519 / 茅台" />
          <select id="daysSelect">
            <option value="60">60 日</option>
            <option value="120" selected>120 日</option>
            <option value="180">180 日</option>
          </select>
          <button id="searchBtn">搜索</button>
          <button id="analyzeBtn">分析</button>
        </div>

        <div class="status" id="statusText"></div>

        <div class="layout">
          <aside class="sidebar">
            <div class="panel">
              <h3>搜索结果</h3>
              <div class="search-results" id="searchResults">
                <div class="empty">输入关键词开始搜索</div>
              </div>
            </div>

            <div class="panel signal-card" id="signalCard">
              <h2 id="stockTitle">请选择股票</h2>
              <div class="signal-header">
                <div>
                  <div class="price" id="latestPrice">--</div>
                  <div class="meta" id="latestDate">--</div>
                </div>
                <div class="signal-pill hold" id="signalPill">观望</div>
              </div>
              <div>
                <div class="meta">综合评分 <strong id="scoreText">0.000</strong></div>
                <div class="score-bar">
                  <div class="score-fill" id="scoreFill"></div>
                </div>
              </div>
              <ul class="reason-list" id="reasonList"></ul>
              <div class="metric-grid" id="metricGrid"></div>
              <div class="risk-note" id="riskNote"></div>
            </div>

            <div class="panel">
              <div class="watchlist-header">
                <h3>自选股</h3>
                <span class="meta" id="watchlistCount">0 只</span>
              </div>
              <div class="watchlist-chips" id="watchlistChips">
                <div class="empty">加载中...</div>
              </div>
              <div class="toolbar watch-toolbar">
                <input id="watchInput" type="text" placeholder="输入代码添加，如 600519" />
                <button class="secondary" id="addWatchBtn" type="button">添加</button>
              </div>
              <div class="watch-actions">
                <button class="secondary small add-current-watch-btn" id="addCurrentWatchBtn" type="button">加入当前股</button>
                <button id="batchBtn" type="button">批量分析</button>
                <button class="secondary small" id="clearWatchBtn" type="button">清空</button>
              </div>
              <div class="monitor-controls">
                <label class="toggle">
                  <input id="monitorToggle" type="checkbox" checked />
                  <span>自动监控</span>
                </label>
                <select id="monitorInterval">
                  <option value="30">30 秒</option>
                  <option value="60" selected>60 秒</option>
                  <option value="300">5 分钟</option>
                </select>
                <button class="secondary small" id="monitorNowBtn" type="button">立即刷新</button>
              </div>
              <label class="toggle notify-toggle">
                <input id="notifyToggle" type="checkbox" />
                <span>信号变化浏览器通知</span>
              </label>
              <div class="alert-panel" id="alertPanel">
                <div class="empty">暂无信号变化告警</div>
              </div>
              <p class="watch-note">自选股会自动保存到浏览器本地</p>
              <div class="watchlist" id="watchlist">
                <div class="empty">点击批量分析查看结果</div>
              </div>
            </div>
          </aside>

          <main class="main">
            <div class="panel chart-card">
              <div class="chart-toolbar">
                <div>
                  <h3>K 线与均线</h3>
                  <p class="chart-hint">滚轮缩放 · 拖拽平移 · 鼠标悬停联动 · ← → 逐根切换</p>
                </div>
                <div class="chart-controls">
                  <label class="toggle">
                    <input id="showBollToggle" type="checkbox" />
                    <span>叠加布林带</span>
                  </label>
                  <button class="secondary small" id="resetZoomBtn" type="button">重置缩放</button>
                </div>
              </div>
              <div class="crosshair-info" id="crosshairInfo">移动鼠标到图表上查看数据，或使用 ← → 键逐根切换 K 线</div>
              <canvas id="priceChart"></canvas>
            </div>

            <div class="panel chart-card">
              <div class="chart-tabs">
                <button class="secondary active" data-chart="macd">MACD</button>
                <button class="secondary" data-chart="rsi">RSI</button>
                <button class="secondary" data-chart="boll">布林带</button>
                <button class="secondary" data-chart="volume">成交量</button>
              </div>
              <canvas id="indicatorChart"></canvas>
            </div>

            <div class="panel chart-card">
              <div class="chart-toolbar">
                <div>
                  <h3>多股收益对比</h3>
                  <p class="chart-hint">归一化走势（起点 = 100），对比自选股区间强弱</p>
                </div>
                <button class="secondary small" id="compareBtn" type="button">刷新对比</button>
              </div>
              <canvas id="compareChart"></canvas>
            </div>
          </main>
        </div>
      </section>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
